<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>gyakorlos</title>
</head>
<body>
    <div class="mainbody">
        <div></div>
        <div class="content">
            <h1 id="title">Regisztráció</h1>
            <div class="form-container">
                <form id="registrationForm">
                    <label for="name">Név:</label>
                    <input type="text" id="name" name="name" required placeholder="Név" title="Kérlek add meg a neved!" pattern="[A-Za-z\s]+">

                    <br>
                    <br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Email" title="Kérlek add meg az email címed!" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">

                    <br>
                    <br>
                    <label for="password">Jelszó:</label>
                    <input type="password" id="password" name="password" required placeholder="Jelszó" title="A jelszónak 6-16 karakter hosszúnak kell lennie, és tartalmaznia kell betűket, számokat és speciális karaktereket." pattern="[A-Za-z0-9!@#$%^&*()_+]{6,16}">

                    <br>
                    <br>

                    <label for="confirmPassword">Jelszó megerősítése:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Jelszó megerősítése" title="Kérlek erősítsd meg a jelszavad!" pattern="[A-Za-z0-9!@#$%^&*()_+]{6,16}">

                    <br>
                    <br>
        
                    <p id="error" class="error"></p>
                    <div class="buttons">
                        <button id="loginButton" type="button" onclick="location.href='login.html'">Már van fiókom</button>
                        
                        <input id="registerButton" type="submit" value="Regisztráció">
                    </div>
                </form>

            </div>
        </div>
        <div></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
