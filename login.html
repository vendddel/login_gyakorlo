<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Bejelentkezés</title>
</head>
<body>
    <div class="mainbody">
        <div></div>
        <div class="content">
            <h1 id="title">Bejelentkezés</h1>
            <div class="form-container">
                <form id="loginForm">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Email" title="Kérlek add meg az email címed!" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">

                    <br>
                    <br>
                    <label for="password">Jelszó:</label>
                    <input type="password" id="password" name="password" required placeholder="Jelszó" title="A jelszónak 6-16 karakter hosszúnak kell lennie, és tartalmaznia kell betűket, számokat és speciális karaktereket." pattern="[A-Za-z0-9!@#$%^&*()_+]{6,16}">

                    <div class="checkbox-row">
                        <label for="showPassword">
                            <input type="checkbox" id="showPassword" onchange="document.getElementById('password').type = this.checked ? 'text' : 'password'">
                            Jelszó megjelenítése
                        </label>
                        <label for="rememberMe">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            Emlékezz rám
                        </label>
                    </div>

                    <a href="elfelejtettjelszo.html" target="_blank" id="forgotPassword" class="form-link">Elfelejtett jelszó?</a>

                    <br>
                    <br>
                    <p id="error" class="error"></p>
                    <div class="buttons">
                        <button id="registerButton" type="button" onclick="location.href='Index.html'">Nincs még fiókom</button>
                        <input type="submit" value="Bejelentkezés">
                    </div>
                </form>

            </div>
        </div>
        <div></div>
    </div>
    <script src="script2.js"></script>
</body>
</html>
