<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style3.css">
    <title>Elfelejtett jelszó</title>
</head>
<body>
    <div class="mainbody">
        <div></div>
        <div class="content">
            <h1>Elfelejtetted a jelszavad?</h1>
            <div class="form-container">
                <div class="header">
                    
                    <p>Kérlek add meg az email címed, amivel regisztráltál!</p>
                    </div>
                <form id="forgotPasswordForm">
                    

                    <br>
                    <br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Email" title="Kérlek add meg az email címed!" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">

                    <br>
                    <br>

                    <p id="error" class="error"></p>
                    <div class="buttons">
                        <input type="submit" value="Jelszó visszaállítása">
                    </div>
                </form>
            </div>
        </div>
        <div></div>
    </div>
</body>
</html>
